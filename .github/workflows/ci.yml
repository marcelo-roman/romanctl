name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      sweep:
        description: Instalar e remover todas as ferramentas (demorado)
        type: boolean
        default: false

env:
  ROMANCTL_TEMPLATES: ${{ github.workspace }}/templates
  # O romanctl só roda com login; aqui o login é um cliente da API do IAM Manager no realm private.
  ROMANCTL_CLIENT_ID: ${{ secrets.ROMANCTL_CLIENT_ID }}
  ROMANCTL_CLIENT_SECRET: ${{ secrets.ROMANCTL_CLIENT_SECRET }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o romanctl ./cmd/romanctl
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ./romanctl platform
      - name: Instala e remove ferramentas de cada tipo
        run: |
          ./romanctl tools install jq kubectl terraform
          kubectl version --client
          terraform version
          ./romanctl tools uninstall jq kubectl terraform --yes
      - name: Simula cada template do catálogo
        run: scripts/templates.sh dry ./romanctl

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: O build embutido no binário está atualizado
        run: git diff --exit-code -- internal/webui/dist && test -z "$(git status --porcelain -- internal/webui/dist)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o romanctl ./cmd/romanctl
      - uses: actions/upload-artifact@v4
        with:
          name: romanctl-linux-amd64
          path: romanctl

  distros:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable", "fedora:latest", "archlinux:latest", "opensuse/tumbleweed:latest", "alpine:latest"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: romanctl-linux-amd64
      - name: Certificados raiz, que a imagem do Debian não traz (o login usa HTTPS)
        if: matrix.image == 'debian:stable'
        run: apt-get update -qq && apt-get install -y -qq ca-certificates
      - run: chmod +x romanctl && ./romanctl platform
      - name: Pacote da distribuição
        run: |
          ./romanctl tools install jq curl
          jq --version
          ./romanctl tools uninstall jq --yes
      - name: Binário oficial
        run: |
          ./romanctl tools install kubectl
          kubectl version --client

  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o romanctl ./cmd/romanctl
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sobe cada serviço em container
        run: |
          for service in postgres mongo redis mysql mariadb sqlserver rabbitmq kafka; do
            ./romanctl install "$service"
            ./romanctl start "$service"
          done
          ./romanctl status
          ./romanctl stop all

  catalog:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.list.outputs.templates }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o romanctl ./cmd/romanctl
      - id: list
        run: echo "templates=$(./romanctl catalog --json | jq -c '[.templates[] | .stack + "/" + .id]')" >> "$GITHUB_OUTPUT"

  templates:
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.catalog.outputs.templates) }}
    name: template ${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o romanctl ./cmd/romanctl
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Testa o template na própria pasta
        run: scripts/templates.sh inplace ./romanctl ${{ matrix.template }}
      - name: Gera com todos os serviços e roda os testes do projeto
        run: scripts/templates.sh test ./romanctl ${{ matrix.template }}

  sweep:
    if: github.event_name == 'workflow_dispatch' && inputs.sweep
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o romanctl ./cmd/romanctl
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/toolsweep.py ./romanctl
