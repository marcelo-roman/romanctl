name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compila para cada plataforma
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X romanctl/internal/cli.version=${GITHUB_REF_NAME#v}" \
              -o "romanctl-$os-$arch" ./cmd/romanctl
          done
          sha256sum romanctl-* > SHA256SUMS
          # O self-update lê este arquivo para saber qual é a última versão.
          echo "$GITHUB_REF_NAME" > VERSION
      - run: gh release create "$GITHUB_REF_NAME" romanctl-* SHA256SUMS VERSION --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
