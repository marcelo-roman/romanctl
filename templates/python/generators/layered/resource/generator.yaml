description: Full CRUD - Django app with model, migration, selectors, services, serializers, views, routes and tests
aliases: [crud, scaffold]
conditional:
  - path: tests/postgres
    when: postgres
patches:
  - file: sample_app/settings.py
    before: "# romanctl:apps"
    text: '"sample_items",'
  - file: sample_app/urls.py
    before: "# romanctl:urls"
    text: 'path("", include("sample_items.urls")),'
  - file: pyproject.toml
    before: "# romanctl:modules"
    text: '"sample_items",'
next: "Routes at /sample-items, in the sample_items app. Run uv run pytest to check. The table is created by the migration in sample_items/migrations on the next uv run sample-app, or with uv run python manage.py migrate."
