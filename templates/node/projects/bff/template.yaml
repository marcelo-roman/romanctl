id: bff
stack: node
arch: [bff]
description: Node monorepo with a Backend for Frontend - orders API and BFF in Fastify, web in React with Vite
services: [postgres]
requires: [node]
setup:
  - run: npm ci
    when: postgres
  - run: npm install
    when: "!postgres"
run: npm run dev
test: npm test
url: http://localhost:3300
processes:
  - name: api
    dir: apps/api
    run: npm run dev
    url: http://localhost:3302
  - name: bff
    dir: apps/bff
    run: npm run dev
    url: http://localhost:3301/health
  - name: web
    dir: apps/web
    run: npm run dev
    url: http://localhost:3300
publish:
  kind: node-bff
conditional:
  - path: apps/api/src/repositories/postgres
    when: postgres
  - path: apps/api/test/repositories/postgres
    when: postgres
overlays:
  - from: _variants/memory
    when: "!postgres"
