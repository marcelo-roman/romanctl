id: hexagonal-ddd
stack: php
arch: [ddd, hexagonal]
description: API PHP com arquitetura hexagonal e DDD, com Symfony e Doctrine DBAL
services: [postgres]
requires: [php]
setup:
  - composer install --no-interaction
run: php -S 127.0.0.1:8002 -t public
test: vendor/bin/phpunit
url: http://localhost:8002
publish:
  kind: php
conditional:
  - path: src/Adapters/Postgres
    when: postgres
  - path: tests/Postgres
    when: postgres
overlays:
  - from: _variants/memory
    when: "!postgres"
