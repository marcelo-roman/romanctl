id: hexagonal-ddd
stack: php
arch: [ddd, hexagonal]
description: PHP API with hexagonal architecture and DDD, using Symfony and Doctrine DBAL
services: [postgres]
requires: [php]
setup:
  - run: composer install --no-interaction
    when: postgres
  - run: composer update doctrine/dbal doctrine/deprecations --no-interaction
    when: "!postgres"
run: php -S 127.0.0.1:8002 -t public
test: vendor/bin/phpunit
url: http://localhost:8002
publish:
  kind: php
conditional:
  - path: src/Adapters/Postgres
    when: postgres
  - path: tests/Postgres
    when: postgres
overlays:
  - from: _variants/memory
    when: "!postgres"
