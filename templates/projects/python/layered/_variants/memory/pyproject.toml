[project]
name = "sample-app"
version = "0.1.0"
description = "API Python em camadas com Django e Django REST Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "gunicorn>=27.0.0",
]

[project.scripts]
sample-app = "sample_app.main:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = [
    "sample_app",
    "tasks",
    # romanctl:modules
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sample_app.settings"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "N", "SIM"]
