id: clean-ddd-cqrs
stack: dotnet
arch: [clean, ddd, cqrs]
description: API .NET com Clean Architecture, DDD e CQRS, com despachante próprio
services: [postgres]
requires: [dotnet]
setup:
  - dotnet restore
run: dotnet run --project src/SampleApp.Api
test: dotnet test
url: http://localhost:5080
env:
  postgres:
    ConnectionStrings__Default: Host={{.Host}};Port={{.Port}};Database={{.Database}};Username={{.User}};Password={{.Password}}
publish:
  kind: dotnet-solution
  vars:
    API: src/SampleApp.Api
    Dll: SampleApp.Api
conditional:
  - path: src/SampleApp.Infrastructure/Persistence/EfCore
    when: postgres
  - path: src/SampleApp.Infrastructure/Persistence/InMemory
    when: "!postgres"
overlays:
  - from: _variants/memory
    when: "!postgres"
