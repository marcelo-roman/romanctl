description: Entity with CRUD inside an existing module (use --in with the module) - domain, use cases, persistence in the module DbContext, routes and tests
needsIn: true
aliases: [crud, scaffold, entity]
requires:
  - path: src/Modules/SampleParent/SampleApp.SampleParent/SampleParentModule.cs
    hint: romanctl add module <Name>, or pass one of the folders in src/Modules with --in
patches:
  - file: src/Modules/SampleParent/SampleApp.SampleParent/SampleParentModule.cs
    before: "// romanctl:services"
    text: |
      services.AddScoped<ISampleItemRepository, SampleItemRepository>();
      services.AddScoped<CreateSampleItemHandler>();
      services.AddScoped<RenameSampleItemHandler>();
      services.AddScoped<GetSampleItemHandler>();
      services.AddScoped<ListSampleItemsHandler>();
      services.AddScoped<DeleteSampleItemHandler>();
  - file: src/Modules/SampleParent/SampleApp.SampleParent/SampleParentModule.cs
    before: "// romanctl:endpoints"
    text: app.MapSampleItemEndpoints();
next: "Routes at /sample-parent/sample-items, registered in SampleParentModule.cs. Run dotnet test to check.{{if .Postgres}} A schema that already has tables gets no new tables on startup: in development, drop the sample_app database to create the sample_items table in the sample_parent schema, or adopt migrations.{{end}}"
