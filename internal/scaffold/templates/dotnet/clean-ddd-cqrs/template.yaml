id: clean-ddd-cqrs
stack: dotnet
arch: [clean, ddd, cqrs]
description: API .NET com Clean Architecture, DDD e CQRS, com despachante próprio
services: [postgres]
requires: [dotnet]
setup:
  - dotnet restore
run: dotnet run --project src/{{.Name}}.Api
test: dotnet test
url: http://localhost:5080
env:
  postgres:
    ConnectionStrings__Default: Host={{.Host}};Port={{.Port}};Database={{.Database}};Username={{.User}};Password={{.Password}}
publish:
  kind: dotnet-solution
  vars:
    API: src/{{.Name}}.Api
    Dll: "{{.Name}}.Api"
conditional:
  - path: src/__Name__.Infrastructure/Persistence/EfCore
    when: postgres
  - path: src/__Name__.Infrastructure/Persistence/InMemory
    when: "!postgres"
